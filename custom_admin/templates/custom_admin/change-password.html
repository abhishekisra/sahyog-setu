{% include 'custom_admin/base.html' %}
{% include 'custom_admin/navbar.html' %}
{% load static %}

{% block body %}

	<div class="pcoded-main-container">
		<div class="pcoded-content">
			<!-- [ breadcrumb ] start -->
			<div class="page-header">
				<div class="page-block">
					<div class="row align-items-center">
						<div class="col-md-12">
							<div class="page-header-title">
								<h5 class="m-b-10">Change Password</h5>
							</div>
							<ul class="breadcrumb">
								<li class="breadcrumb-item"><a href="{% url 'adminDashboard' %}"><i class="feather icon-home"></i></a></li>
								<li class="breadcrumb-item"><a href="#!">Change Password</a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<!-- [ breadcrumb ] end -->
			<!-- [ Main Content ] start -->
			<div class="row">
				<div class="col-md-6">
					<div class="card">
						<div class="card-header">
							<h5>Update your login password</h5>
						</div>
						<div class="card-body">
							<form method="POST" action="{% url 'adminChangePassword' %}">
								{% csrf_token %}
								<div class="form-group">
									<label>Current Password</label>
									<input type="password" class="form-control" name="current_password" required>
								</div>
								<div class="form-group">
									<label>New Password</label>
									<input type="password" class="form-control" name="new_password" minlength="6" required>
								</div>
								<div class="form-group">
									<label>Confirm New Password</label>
									<input type="password" class="form-control" name="confirm_password" minlength="6" required>
								</div>
								<button type="submit" class="btn btn-primary">Change Password</button>
							</form>
						</div>
					</div>
				</div>
			</div>
			<!-- [ Main Content ] end -->
		</div>
	</div>
{% endblock %}

{% for message in messages %}
    <script>
        showNotification('{{message}}', '{{message.tags}}')
    </script>
{% endfor %}
