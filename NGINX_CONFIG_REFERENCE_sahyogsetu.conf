server {
    server_name sahyogsetu.in www.sahyogsetu.in;

    root /var/www/html;
    index index.html;

    # 2026-10-19: CSP in Report-Only mode (nothing blocked) -- collects
    # violations in /var/log/nginx/csp-reports.log before any enforcement.
    # Repeated inside location = /index.html (own add_header => no inheritance).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client https://www.googletagmanager.com https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://maps.google.com https://maps.googleapis.com https://www.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://sahyogsetu.in https://maps.googleapis.com https://accounts.google.com/gsi/ https://www.googletagmanager.com https://*.google-analytics.com https://translate.googleapis.com https://translate-pa.googleapis.com; frame-src 'self' https://accounts.google.com/gsi/ https://www.youtube.com https://www.googletagmanager.com https://maps.google.com https://www.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /csp-report" always;

    include snippets/csp-report-endpoint.conf;

    # 2026-10-19 (Batch 1): uploaded scheme/news images and Django
    # collectstatic output. Neither has fingerprinted names, so 1 day +
    # revalidate (an edited image shows up by the next day at the latest).
    # 2026-11-05: signature PNGs only via Django /quiz/<id>/signature/<n>/ (login + passed/staff)
    location ^~ /media/quiz/authorities/signatures/ {
        return 404;
    }
    location /media/ {
        alias /var/www/html/SAHYOG_SETU_ADMIN/media/;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        include snippets/sahyog-static-headers.conf;
    }

    location /public/static/ {
        alias /var/www/html/SAHYOG_SETU_ADMIN/public/static/;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        include snippets/sahyog-static-headers.conf;
    }

    # 2026-10-19 (Batch 1): React build output -- static/js/main.<hash>.js,
    # static/css/main.<hash>.css, static/media/* all have content hashes in
    # the filename (a new build = new name), so they can be cached for a
    # year. =404 instead of the SPA fallback so a missing chunk fails loudly
    # rather than returning index.html as "JavaScript".
    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/sahyog-static-headers.conf;
    }

    # 2026-10-19 (Batch 1): theme files (bootstrap/jquery/style.css/img).
    # NOT fingerprinted -- style.css is edited in place -- so only 1 day.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        include snippets/sahyog-static-headers.conf;
    }

    # SAHYOG_SETU_ADMIN/ physically lives under the nginx root (/var/www/html),
    # so without this block every file in the Django project — settings.py
    # (SECRET_KEY, DB password), manage.py, .git/, source .py files — was
    # directly downloadable over the web via the generic try_files fallback
    # below. The only things that legitimately need direct serving from
    # inside that folder are /media/ and /public/static/, already aliased
    # above as their own top-level URL paths — nothing legitimate is ever
    # requested at a literal /SAHYOG_SETU_ADMIN/... URL.
    # 2026-10-19 (security audit): full DB dumps and site-backup zips sit in
    # the nginx root and were publicly downloadable (confirmed 200 on
    # db_backup_27apr/*.sql and both *_backup.zip). Blocked by exact name,
    # not by extension, so no legit Django/React route can be caught by it.
    location ~ ^/(db_backup_27apr/|sahyog_setu_backup\.zip|other_files_backup\.zip|11static/|11index\.html|index\.nginx-debian\.html) {
        deny all;
        return 404;
    }

    # 2026-11-04 (security audit): the SPA fallback answered 200 (homepage
    # HTML) for /.env, /.git/config, /backup.sql, /settings.py ... -- no real
    # file leaked, but every automated scanner reports that as a finding.
    # Real 404 for dotfiles (except ACME) and server-side file types.
    location ~ ^/(requirements\.txt|package(-lock)?\.json|composer\.(json|lock)|web\.config|server-(status|info)|phpmyadmin|wp-admin|wp-login\.php|xmlrpc\.php)(/|$) {
        deny all;
        return 404;
    }
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }
    location ~* \.(env|sql|bak|old|orig|swp|py|pyc|zip|tar|gz|7z|rar|log|ini|cfg|conf|toml|lock|sh|key|pem|php|asp|aspx|jsp|sqlite3?|db)$ {
        deny all;
        return 404;
    }

    location ^~ /SAHYOG_SETU_ADMIN/ {
        deny all;
        return 404;
    }

    # Exact match for /admin/ - proxy to Django
    location = /admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }

    # Rewrite /admin/api/* -> /api/*
    location ^~ /admin/api/ {
        rewrite ^/admin/api/(.*)$ /api/$1 break;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
        include proxy_params;
    }

    # The React quiz-listing pages (/quizzes, home page quiz cards) link to
    # "Start Quiz" as /quiz/<slug>/<base64-id>/ -- a stray extra path segment
    # that Django's quiz_landing route (/quiz/<slug>/, single segment) 404s
    # on. Can't fix the React bundle (no source on this box, prod-only
    # build), so this strips the bogus segment before it ever reaches
    # Django. Scoped tightly to base64-padding-looking segments (ending in
    # one or more '=') so it can never match a real route -- take/answer/
    # submit/result/leaderboard/certificate/qr and numeric quiz ids never
    # end in '='.
    location ~ ^/quiz/([^/]+)/[A-Za-z0-9+/]*=+/?$ {
        return 301 /quiz/$1/;
    }

    # All Django backend routes -- dashboard/login/logout/quizzes (plural)
    # removed: none of those exist as bare Django routes (only /admin/...,
    # /accounts/..., /api/quizzes do), so they belong to the React SPA
    # below, not this proxy. accounts/ added: mobile+password signup/login
    # (accounts.urls) was never reachable before -- no React route collides
    # with it (checked the live bundle). scheme-viewer/ added: new
    # Django-rendered public scheme finder (schemes.views.scheme_finder)
    # -- a brand new path, no existing SPA route to collide with. (Was
    # named scheme-eligibility/, renamed to scheme-viewer/.)
    # important-portals-viewer/ added: same pattern, new Django-rendered
    # Important Portals page (important_portals.views.portal_finder) --
    # distinct name from the SPA's own existing /important-portals so
    # there's no collision; that old route is left alone for now (not
    # redirected here) until confirmed safe to redirect.
    # important-documents-viewer/ added: same pattern again, new
    # Django-rendered Important Documents page
    # (important_documents.views.document_finder).
    # entrepreneurship/legal-registrations-viewer/,
    # entrepreneurship/organization-registrations-viewer/,
    # entrepreneurship/business-plans-viewer/,
    # entrepreneurship/artificial-intelligence-viewer/ and
    # entrepreneurship/marketing-viewer/ added: same pattern, new
    # Django-rendered pages for all 5 Entrepreneurship Development
    # sub-sections. scheme-announcements-viewer/ and entrepreneurship-viewer/
    # added: same pattern, new Django-rendered Scheme Announcements page and
    # the Entrepreneurship Development landing/hub page (5 nav cards to the
    # sub-sections above). entrepreneurship/business-related-schemes-viewer/
    # added: same pattern, replacing the old SPA's Business Development
    # Schemes page (which showed every card as just a bare title + "Click
    # Here" button, no image field on Schemes to begin with) with the same
    # icon-card + detail-overlay treatment as the rest.
    # news-viewer/ and pages-viewer/ added: same pattern, new Django-rendered
    # News and Pages sections (news.views.news_finder,
    # pages.views.page_finder/page_detail) -- both previously SPA-only
    # (/api/news, /api/pages), only 5-7 rows each so no search-light
    # machinery needed. Old SPA routes and the /api/news, /api/pages DRF
    # endpoints are left untouched, not redirected here.
    # 2026-11-05 security check: brute-force / lookup limits (zones in conf.d/sahyog-ratelimit.conf)
    location = /partner-login/ {
        limit_req zone=sahyog_login burst=5 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }
    location = /admin/login {
        limit_req zone=sahyog_login burst=5 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }
    location = /accounts/login/ {
        limit_req zone=sahyog_login burst=5 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }
    location = /trainer/login/ {
        limit_req zone=sahyog_login burst=5 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }
    location = /accounts/check-availability/ {
        limit_req zone=sahyog_lookup burst=10 nodelay;
        limit_req_status 429;
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }

    location ~ ^/(admin|developer-admin|api|quiz/|quiz-analytics|certificate/|my-results|my-schemes/|accounts/|partner-login|partner-logout|partner/|trainer/|scheme-viewer/|important-portals-viewer/|important-documents-viewer/|entrepreneurship/legal-registrations-viewer/|entrepreneurship/organization-registrations-viewer/|entrepreneurship/business-plans-viewer/|entrepreneurship/artificial-intelligence-viewer/|entrepreneurship/marketing-viewer/|scheme-announcements-viewer/|entrepreneurship-viewer/|entrepreneurship/business-related-schemes-viewer/|central-schemes-viewer/|state-schemes-viewer/|helplines-viewer/|news-viewer/|pages-viewer/) {
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }

    # 2026-11-08: per-scheme sitemap (Django, all active schemes) for Google
    location = /sitemap-schemes.xml {
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }

    # /quizzes (plural) now has a real Django-rendered listing
    # (quizzes.views.QuizListView) that replaces the React SPA's own card
    # grid -- the SPA page showed uploaded banner images, a stale "0 min"
    # duration badge, and full question-bank counts instead of the actual
    # per-attempt sample size, none of which were fixable without frontend
    # source (prod-only build on this box). Exact-match (not the ~ regex
    # prefix block above) so it doesn't shadow /quiz/... routes, and a
    # separate slash-less alias since real links/bookmarks use both forms.
    location = /quizzes {
        return 301 /quizzes/;
    }
    location = /quizzes/ {
        include proxy_params;
        proxy_pass http://unix:/run/sahyogsetu/sahyogsetu.sock;
    }

    # Old React SPA homepage cards "Central Schemes" (/schemes-and-services/*)
    # and "State Schemes" (/schemes/map) were BOTH briefly redirected here to
    # the new Django-rendered scheme-viewer/ page, on the assumption they
    # were just flat, unfiltered scheme lists -- wrong for both. /schemes/map
    # is a real interactive India map (per-state SVG paths); the "Central
    # Schemes" page (/schemes-and-services/:scheme_type, React component
    # `mi`/`gi`) renders a clickable CATEGORY CARD GRID (image+title per
    # category, click -> /schemes/central/<id>) -- a genuinely different
    # browsing UI from the new page's flat filter-dropdown, not a redundant
    # duplicate. Redirecting either away broke a real feature (reported by
    # user first as "state map gayab ho gya", then "central scheme mai
    # category card nhi aaya"). Neither is redirected anymore -- both work
    # exactly as they did before scheme-viewer/ existed. scheme-viewer/
    # remains reachable directly; it isn't wired into either homepage card.
    #
    # scheme-eligibility/ was this page's name for a short time earlier in
    # its life before being renamed to scheme-viewer/ -- redirect any
    # already-shared/bookmarked links rather than letting them fall through
    # to the generic SPA shell.
    location = /scheme-eligibility/ {
        return 301 /scheme-viewer/;
    }

    # Direct-URL/bookmark equivalents of index.html's client-side route-poll
    # redirect (same two routes, see the comment there): the category-card
    # grid's and state-map's own per-category/per-state results pages now
    # show in scheme-viewer/'s design instead, pre-filtered. Only fires on a
    # real HTTP request (typed URL, hard refresh) -- the actual card/map
    # click is client-side routing, caught by index.html's JS instead.
    location ~ ^/schemes/central/([^/]+)/?$ {
        return 301 /scheme-viewer/?category=$1;
    }
    location ~ ^/schemes/map/state/([^/]+)/[^/]+/?$ {
        return 301 /scheme-viewer/?state=$1;
    }

    # Old SPA scheme detail page -> Scheme Viewer's detail overlay (same
    # Schemes row, real design). Direct-URL/bookmark/shared-link equivalent
    # of index.html's /scheme/:id click-intercept + route-poll.
    location ~ ^/scheme/(\d+)/?$ {
        return 301 /scheme-viewer/?scheme=$1;
    }

    # Direct-URL/bookmark equivalents of index.html's route-poll redirect
    # for the 7 rebuilt Important Portals/Documents + Entrepreneurship
    # Development pages (see the comment there) -- all 7 old SPA routes
    # were confirmed (via the live bundle) to be plain "fetch a flat list,
    # render cards" components with no hidden distinct feature (unlike
    # /schemes/map or the category-card grid above), so these are safe to
    # redirect outright rather than leaving the old page reachable.
    # /entrepreneurship-developement itself (the landing hub page linking
    # to these 5 sub-sections plus business-related-schemes) now has its
    # own rebuilt replacement too (entrepreneurship-viewer/), so it's
    # redirected here as well. Same for /scheme-announcements.
    location = /important-portals {
        return 301 /important-portals-viewer/;
    }
    location = /important-documents {
        return 301 /important-documents-viewer/;
    }
    location = /scheme-announcements {
        return 301 /scheme-announcements-viewer/;
    }
    location = /entrepreneurship-developement {
        return 301 /entrepreneurship-viewer/;
    }
    location = /entrepreneurship-developement/legal-registrations {
        return 301 /entrepreneurship/legal-registrations-viewer/;
    }
    location = /entrepreneurship-developement/organization-registrations {
        return 301 /entrepreneurship/organization-registrations-viewer/;
    }
    location = /entrepreneurship-developement/business-plans {
        return 301 /entrepreneurship/business-plans-viewer/;
    }
    location = /entrepreneurship-developement/artificial-intelligence {
        return 301 /entrepreneurship/artificial-intelligence-viewer/;
    }
    location = /entrepreneurship-developement/marketing {
        return 301 /entrepreneurship/marketing-viewer/;
    }
    location = /entrepreneurship-developement/business-related-schemes {
        return 301 /entrepreneurship/business-related-schemes-viewer/;
    }
    # Old SPA's Central Govt Schemes category-grid landing page -- confirmed
    # (via the live bundle + a real screenshot) to be plain "fetch
    # categories from /api/schemes-and-services, render cards, click ->
    # filtered scheme list" with no hidden distinct feature, so safe to
    # redirect outright like the 7 above, unlike /schemes/map or the old
    # business-related-schemes page's original concern.
    location = /schemes-and-services/central {
        return 301 /central-schemes-viewer/;
    }
    # Old SPA's Helplines page -- plain design graphics with the number
    # baked in, no other distinct feature -- safe to redirect outright,
    # same as central above.
    location = /helplines {
        return 301 /helplines-viewer/;
    }
    # Old per-scheme detail bookmarks -- opens straight into that scheme's
    # own overlay via the new page's ?scheme=<id> deep-link support (see
    # business_related_scheme_finder.html), instead of just landing on the
    # plain list.
    location ~ ^/entrepreneurship-developement/business-related-scheme/([^/]+)/?$ {
        return 301 /entrepreneurship/business-related-schemes-viewer/?scheme=$1;
    }

    # index.html had no Cache-Control at all (just default Last-Modified/
    # ETag), so a browser or intermediate proxy could serve an old cached
    # copy without revalidating -- meaning whatever redirect entries were
    # in SSQ_ENTREPRENEURSHIP_REDIRECTS / checkSchemeResultRoute etc. at
    # THAT older moment are what actually run, silently missing every
    # route added since. This is why old SPA pages/behavior appeared to
    # show up "sometimes" rather than never or always -- classic stale-
    # cache intermittency, not a logic bug. index.html is served both as
    # the literal root request AND as try_files' fallback below (which
    # nginx re-matches against location blocks by URI, so this also
    # covers every client-side-route hard refresh) -- no-cache forces a
    # revalidation request every time, so the latest redirect list is
    # always the one that runs. The hashed static/js/main.<hash>.js bundle
    # itself is deliberately NOT touched here -- content-hashed filenames
    # are supposed to cache aggressively, that's the whole point of the
    # hash.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/sahyog-static-headers.conf;
    }

    # React Frontend -- fallback to index.html so direct navigation / hard
    # refresh on a client-side route (e.g. /quizzes, /dashboard) loads the
    # SPA instead of a raw 404.
    location / {
        include snippets/sahyog-static-headers.conf;
        try_files $uri $uri/ /index.html;
    }


    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sahyogsetu.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sahyogsetu.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sahyogsetu.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sahyogsetu.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name sahyogsetu.in www.sahyogsetu.in;
    listen 80;
    return 404; # managed by Certbot




}